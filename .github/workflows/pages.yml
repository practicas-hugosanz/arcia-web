# Compila la web y la publica en GitHub Pages en cada push a main.
#
# Pages no puede servir el código tal cual: el HTML lleva marcas que sustituye
# el build (%URL%, iconos, imágenes a varios tamaños) y enlaza /src/estilos.css,
# que solo existe en desarrollo. Lo que se publica es `dist/`.
#
# Se sirve bajo /arcia-web/, así que se compila con esa base, y la canónica y
# el sitemap apuntan a la dirección de github.io mientras no haya dominio.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE: /arcia-web/
          SITIO_URL: https://practicas-hugosanz.github.io/arcia-web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
